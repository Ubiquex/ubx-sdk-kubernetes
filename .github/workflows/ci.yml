name: ci

# Generated bindings across three languages (ubx sdk gen's own real
# output, "DO NOT EDIT" per every generated package.json/pyproject.toml
# here) -- no hand-written logic to unit-test, but a real, non-trivial
# check still exists: does every generated file actually compile or
# typecheck in its own language. Catches a real codegen bug (a naming
# collision, a malformed generated file, an import cycle), not a
# check that always passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # The base branch is main, enforced rather than asked.
      #
      # TRAPS.md's own "a stacked PR is only safe while its base is
      # unmerged" trap. A PR based on another branch merges into THAT
      # branch. GitHub retargets it when the base lands on main, but
      # only if it gets there first, and twice in ubiquex it did not:
      # the dependent PR merged into an already-dead base seconds
      # later, showed MERGED, and its content never reached main.
      #
      # stale-base-check (where this org has it) asks the narrower
      # question, whether the base is ALREADY merged, and it is a real
      # guard. It cannot catch this shape though: it triggers on
      # pull_request opened/synchronize/reopened, so it evaluates when
      # the PR is pushed and never at the moment the merge button is
      # clicked, which is the one moment the trap fires. A PR opened
      # while its base was healthy stays green through the base
      # merging out from under it.
      #
      # This question does not depend on when it is asked. The base is
      # main or it is not, and that cannot change between opening and
      # merging except by retargeting, which only moves it toward main.
      #
      # It lives inside a job branch protection already requires, so a
      # stacked PR cannot merge rather than merely being discouraged,
      # and no branch-protection change was needed to add it.
      - name: The base branch is main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "main" ]; then
            echo "base is main"
            exit 0
          fi
          {
            echo "This PR targets \"$BASE\", not main."
            echo
            echo "A PR based on another branch merges into THAT branch. If the base"
            echo "reaches main first, this PR merges into a dead branch, reports MERGED,"
            echo "and its content never lands. Nothing tells that apart from a real merge"
            echo "except an explicit ancestry check after the fact."
            echo
            echo "Branch from main and open this against main. If it genuinely depends on"
            echo "unmerged work, wait for that to land and rebase onto main:"
            echo
            echo "    git rebase --onto main <old-base> <this-branch>"
            echo
            echo "If a non-main base is ever genuinely right in this repo, change this step"
            echo "deliberately, in its own reviewed PR, rather than working around it."
          } >&2
          exit 1

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - name: go build (sdk/go)
        run: go build ./...
        working-directory: sdk/go

      - name: Generated Go is gofmt-clean
        # gofmt is the single canonical form the Go ecosystem assumes,
        # and nothing was applying it: codegen did not, hash-watch.yml
        # did not, and this workflow only ran go build, which is
        # perfectly happy with unformatted source. 203 of this repo's
        # 248 generated Go files had drifted out of it before anyone
        # looked, and the sweep that fixed them was proven to change
        # formatting only by comparing the Go token stream of every file
        # before and after (UBI-244).
        #
        # ubx sdk gen now formats its own output, so this is a check
        # that that stays true rather than the thing that makes it true.
        # gofmt -l names offending files and exits 0 either way, so the
        # emptiness of its output is the assertion, not the exit code.
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "ok: every generated Go file is gofmt-clean"
        working-directory: sdk/go

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno install (sdk/typescript)
        # deno check's own type resolution for the real npm dependency
        # (@ubx/sdk, package.json) needs node_modules populated first --
        # caught live on this workflow's own first real PR run: "Could
        # not find @ubx/sdk in a node_modules folder."
        run: deno install
        working-directory: sdk/typescript

      - name: deno check (sdk/typescript)
        run: find . -name "*.ts" -print0 | xargs -0 deno check
        working-directory: sdk/typescript

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install and compile (sdk/python)
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m compileall -q ubx
        working-directory: sdk/python

      - name: README counts match the generated tree
        # The README-GEN block looks generated and never was: it went
        # stale by 41 data sources and nothing said (UBI-241). Derived
        # from the tree here so it cannot drift again, and counted across
        # all three languages so a partial regeneration is caught too.
        run: python3 scripts/check_readme_counts.py
