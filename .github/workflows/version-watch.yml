name: version-watch

# Weekly check against the real Terraform Registry provider-versions API
# for a newer hashicorp/kubernetes release. On a newer version: bumps
# VERSION, re-runs `ubx sdk gen --lang go|ts|py --out .` against it (all
# three languages, one PR), and opens a PR with the combined diff for
# review. Never auto-merges (UBI-99/UBI-104/UBI-105/UBI-112/UBI-113/
# UBI-114, ported to UBI-138's single combined per-provider repo).
#
# Ported from the corrected ubx-sdk-google's own version-watch.yml
# (UBI-138 Phase 2) -- the real, working reference implementation for
# this combined-repo layout, not the pre-consolidation
# ubx-sdk-kubernetes-{go,ts,py} repos (those predate the sdk/ restructure
# and have their own real, known gaps -- see publish.yml's own header
# for the version-bump-source bug specifically).

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-sdk-kubernetes
        uses: actions/checkout@v4

      - name: Query Terraform Registry for the latest hashicorp/kubernetes version
        id: registry
        run: |
          set -euo pipefail
          # Confirmed real API (HashiCorp's own docs): no auth needed.
          response="$(curl -sf https://registry.terraform.io/v1/providers/hashicorp/kubernetes/versions)"
          latest="$(echo "$response" | jq -r '.versions[].version' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "registry query returned no versions -- failing loudly rather than silently no-op'ing" >&2
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Terraform Registry reports latest hashicorp/kubernetes version: $latest"
          # Known, accepted limitation (UBI-99): `sort -V` on semver
          # strings is usually correct but not bulletproof against
          # pre-release tags. Fine for v1; harden if HashiCorp ever ships
          # a pre-release that trips this.
          #
          # NOTE (UBI-138 Phase 2, real finding on Google, re-checked and
          # NOT hit for Kubernetes's own first generation -- both
          # registries agreed on 3.2.1 -- but the gap itself is real and
          # can recur for any provider): the Terraform Registry API can
          # list a version here before it's actually acquirable -- `ubx
          # sdk gen` fetches provider binaries from OpenTofu's own mirror
          # (registry.opentofu.org, provider/registry.go's own deliberate
          # substitution), which can lag the real HashiCorp registry by
          # some real, observed amount. The "Acquire provider" step below
          # will fail loudly with a clear "provider release not found for
          # this platform" error if this happens -- not silently
          # regenerate from a version it can't actually fetch.

      - name: Compare against this repo's pinned version
        id: compare
        run: |
          set -euo pipefail
          current="$(cat VERSION)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "This repo was last generated from: $current"
          if [ "$current" = "${{ steps.registry.outputs.latest }}" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Already current -- nothing to do."
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

      # --- everything below only runs when a newer version was found ---

      - name: Check out ubiquex (to build ubx from source)
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # Plain `git clone` into $RUNNER_TEMP -- deliberately OUTSIDE
          # this repo's own checkout (which doubles as $GITHUB_WORKSPACE).
          # A real rsync self-overlap bug in this pattern's own first-ever
          # live run (ubx-sdk-aws-go, pre-consolidation) taught this:
          # generating into a scratch dir INSIDE the repo checkout made
          # `rsync --delete`'s destination scan treat its own
          # still-being-read source as extraneous destination content and
          # delete it mid-transfer ("file has vanished", rsync exit 24).
          # Keeping every scratch path under $RUNNER_TEMP makes that
          # class of source/destination overlap structurally impossible.
          #
          # Fine-grained PAT, contents:read only on Ubiquex/ubiquex.
          # Needed because ubiquex is private and the default
          # GITHUB_TOKEN here is scoped to this repo (ubx-sdk-kubernetes)
          # only.
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.UBIQUEX_SOURCE_TOKEN }}@github.com/Ubiquex/ubiquex.git" \
            "${{ runner.temp }}/ubiquex-src"

      - name: Set up Go
        if: steps.compare.outputs.newer == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubiquex-src/go.mod

      - name: Set up Deno
        if: steps.compare.outputs.newer == 'true'
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.x"

      - name: Set up Python
        if: steps.compare.outputs.newer == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ubx
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # Built from ubiquex's own `main` HEAD, not a tagged release:
          # there's no release cadence yet that tracks feature landings,
          # so source-from-main is the only way to get `ubx sdk gen`'s
          # current, correct behavior. Accepted tradeoff for v1: an
          # ubiquex regression on main could affect this workflow;
          # revisit once a real release process exists.
          # (`-C` must be the FIRST flag to `go build`.)
          go build -C "${{ runner.temp }}/ubiquex-src" -o "${{ runner.temp }}/ubx" ./cmd/ubx
          "${{ runner.temp }}/ubx" version

      - name: Regenerate bindings (all three languages)
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          gendir="${{ runner.temp }}/ubxgen"
          mkdir -p "$gendir/.ubx"
          cat > "$gendir/.ubx/config" <<EOF
          [providers]
          "hashicorp/kubernetes" = "${{ steps.registry.outputs.latest }}"
          EOF
          # `ubx sdk gen` is schema-only: no Configure, no credentials
          # needed (confirmed by its own --help text, and by this job
          # never setting any cluster credential at all).
          #
          # Each language's own semver `version` field (package.json /
          # deno.json / pyproject.toml) is owned by publish.yml, not by
          # codegen -- codegen always writes "0.0.0" (sdk/codegen/
          # templates/{ts,py}.go's own hard-coded package-version
          # placeholder). Capture the real, currently-committed values
          # before regen overwrites them, restore after.
          own_ts_version="$(python3 -c "import json; print(json.load(open('sdk/typescript/package.json'))['version'])")"
          own_py_version="$(python3 -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")"

          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --lang go --out out )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --lang ts --out out )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --lang py --out out )

          # `--out` writes a repo-shaped tree under
          # <out>/<source-sanitized>/sdk/<lang>/ (UBI-138); flatten each
          # language's own sdk/<lang>/ back onto this repo's own
          # sdk/<lang>/, matching the current commit's own layout.
          # go.sum, deno.json/deno.lock are hand/tooling-maintained, not
          # codegen output, and are excluded from the regeneration diff.
          rsync -a --delete \
            --exclude='go.sum' \
            "$gendir/out/hashicorp-kubernetes/sdk/go/" sdk/go/
          rsync -a --delete \
            --exclude='deno.json' --exclude='deno.lock' \
            "$gendir/out/hashicorp-kubernetes/sdk/typescript/" sdk/typescript/
          rsync -a --delete \
            "$gendir/out/hashicorp-kubernetes/sdk/python/" sdk/python/

          python3 -c "
          import json
          p = 'sdk/typescript/package.json'
          d = json.load(open(p))
          d['version'] = '$own_ts_version'
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          python3 -c "
          import re
          p = 'sdk/python/pyproject.toml'
          content = open(p).read()
          content = re.sub(r'version = \"[^\"]+\"', 'version = \"$own_py_version\"', content, count=1)
          open(p, 'w').write(content)
          "

          echo "${{ steps.registry.outputs.latest }}" > VERSION

      - name: Refresh sdk/typescript/deno.json's exports map for the regenerated tree
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # deno.json's name/version/license/imports are hand/publish
          # -workflow-maintained (excluded above), but `exports` is an
          # explicit, generated, one-entry-per-file map (JSR export keys
          # don't support wildcards) -- it MUST be regenerated every run
          # or a new resource type file lands with no export entry,
          # silently unimportable from the published package.
          python3 - <<'PYEOF'
          import json, os

          with open("sdk/typescript/deno.json") as fh:
              cfg = json.load(fh)

          exports = {}
          for dirpath, _, filenames in os.walk("sdk/typescript/kubernetes"):
              for f in sorted(filenames):
                  if not f.endswith(".ts"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), "sdk/typescript")
                  exports["./" + rel[:-3]] = "./" + rel

          cfg["exports"] = exports

          with open("sdk/typescript/deno.json", "w") as fh:
              json.dump(cfg, fh, indent=2)
              fh.write("\n")

          print(f"sdk/typescript/deno.json exports: {len(exports)} entries")
          PYEOF

      - name: Regenerate sdk/go/go.sum
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go mod tidy

      - name: Sanity-check the regenerated Go tree still builds
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go build ./...
          go vet ./...

      - name: Sanity-check the regenerated TS tree still typechecks
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # `@ubx/sdk` is a real jsr: dependency -- `--no-remote`
          # structurally refuses to resolve ANY remote specifier
          # (jsr:/https:), cache or lockfile notwithstanding, so
          # `deno cache` (network, warms the lockfile/module cache)
          # followed by `deno check --frozen` (cache-only from here;
          # fails if the lockfile would need to change) is the real
          # offline-safe equivalent.
          cd sdk/typescript
          find . -name "*.ts" -print0 | xargs -0 deno cache
          find . -name "*.ts" -print0 | xargs -0 deno check --frozen

      - name: Sanity-check the regenerated Python tree -- real import of every module
        if: steps.compare.outputs.newer == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          # A real recursive `importlib.import_module` of every generated
          # module (not a syntax lint) -- `ubx_sdk` itself resolves via a
          # real PyPI install (its version pin read straight out of
          # pyproject.toml, so this can never drift from the real
          # declared version range).
          deps="$(cd sdk/python && python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")"
          pip install $deps
          python3 - <<'PYEOF'
          import os, sys, importlib

          repo_root = os.path.join(os.getcwd(), "sdk", "python")
          sys.path.insert(0, repo_root)

          count = 0
          errors = []
          for dirpath, dirnames, filenames in os.walk(repo_root):
              for f in filenames:
                  if not f.endswith(".py"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), repo_root)
                  mod = rel[:-3].replace(os.sep, ".")
                  if mod.endswith(".__init__"):
                      mod = mod[: -len(".__init__")]
                  try:
                      importlib.import_module(mod)
                      count += 1
                  except Exception as e:
                      errors.append((mod, str(e)))

          print(f"imported {count} modules OK")
          if errors:
              print(f"{len(errors)} ERRORS:")
              for m, e in errors:
                  print(f"  {m}: {e}")
              sys.exit(1)
          print("ZERO errors")
          PYEOF

      - name: Open PR
        if: steps.compare.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="sdk-regen/hashicorp-kubernetes-${{ steps.registry.outputs.latest }}"
          git checkout -b "$branch"
          git add -A
          git commit -m "sdk: regenerate from hashicorp/kubernetes@${{ steps.registry.outputs.latest }}"
          git push origin "$branch" --force
          gh pr create \
            --title "sdk: regenerate from hashicorp/kubernetes@${{ steps.registry.outputs.latest }}" \
            --body "Automated regeneration (\`.github/workflows/version-watch.yml\`) triggered by a newer \`hashicorp/kubernetes\` version on the Terraform Registry -- all three languages (sdk/go/, sdk/typescript/, sdk/python/) regenerated together in this one PR (UBI-138: one combined repo, not three).

          Previous: \`${{ steps.compare.outputs.current }}\`
          New: \`${{ steps.registry.outputs.latest }}\`

          New files = new service. Modified files = an existing resource's schema changed. This never auto-merges -- review the diff before merging." \
            --base main --head "$branch"
