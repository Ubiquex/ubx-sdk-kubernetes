name: hash-watch

# Replaces version-watch.yml as of v1.0.0's source change: this repo no
# longer generates from the hashicorp/kubernetes Terraform provider, so
# polling the Terraform Registry for a hashicorp/kubernetes version bump
# would watch the wrong thing entirely. The real source since 1.0.0 is
# Kubernetes' own OpenAPI/Swagger API description, pinned to the
# release-1.37 branch -- a real, live branch, not a tag, with no
# discrete pinnable release the way a tag would give. Instead: re-fetch
# the same URL, hash it, and compare against VERSION's committed
# spec-sha256. On a hash change: bumps VERSION, re-runs
# `ubx sdk gen --lang go|ts|py --out .` against it (all three languages,
# one PR), and opens a PR with the combined diff for review. Never
# auto-merges, same as every other repo in this org.
#
# 1.1.0: switched from raw-byte hashing to the same canonicalized-content
# hashing used by ubx-sdk-datadog/-github/-azure/-google, so all six repos
# in this org watch drift the same way. This repo and ubx-sdk-aws were
# built alongside the original four but never actually converted to this
# method -- both still hashed raw fetched bytes directly, found only when
# asked to confirm all six matched. Kubernetes' own swagger.json is a
# single static document (closer to GitHub's own shape than a multi-member
# group), so this reuses GitHub's single-document canonicalize() rather
# than the multi-member merge logic Datadog/Azure/Google need. Confirmed
# live this session that re-serializing changes the byte representation
# even though this document's raw bytes were already stable and already
# matched the prior committed hash -- so this VERSION's spec-sha256 value
# moves here even though the underlying spec content has not.
#
# Also carries the other two real, found-live fixes already applied to
# the other four repos this session:
#
# 1. UBIQUEX_SOURCE_TOKEN removed. ubiquex and ubx-provider-dynamic are
#    now public repos -- a plain, unauthenticated clone needs no token.
#    (Formerly a fine-grained PAT; that secret was never actually set on
#    this repo, confirmed directly via the API, so this checkout always
#    failed here regardless of whether a real change was ever found.)
#
# 2. --recurse-submodules added to the ubiquex clone. ubiquex's own
#    sdk/go, sdk/py, sdk/ts are real git submodules (its own Makefile
#    runs `git submodule update --init --recursive` before every build);
#    a bare clone leaves them empty and `go build ./cmd/ubx` below fails
#    ("no required module provides package .../sdk/py"). Applied here
#    even though this repo's own regen path has never actually run yet
#    (this repo's compare step has always found the corpus unchanged in
#    every real test so far) -- the dependency is identical to the other
#    repos where this was caught live.
#
# Ported from ubx-sdk-aws's own hash-watch.yml (the real, working
# reference for this content-hash-based pattern on a dynamic provider
# with no discrete pinnable release). release-1.37 is a real, live
# Kubernetes branch, not a tag, so its content can still drift between
# now and Kubernetes' next minor release -- this workflow only detects
# that drift; moving to a newer release-1.NN branch is a separate,
# manual edit to [dynamic_providers.kubernetes]'s own schema_url in
# ubiquex. Same ubx-provider-dynamic checkout requirement as every
# dynamic-provider entry (cli/dynamicprovider.go's
# UBX_PROVIDER_DYNAMIC_REPO convention).

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  ERROR_ISSUE_LABEL: hash-watch-error

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-sdk-kubernetes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up PyYAML
        run: pip install --quiet pyyaml

      - name: Fetch the real Kubernetes OpenAPI/Swagger spec and compute its canonicalized-content spec-sha256
        id: spec
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, json, os, time, urllib.error, urllib.request, yaml, datetime

          URL = "https://raw.githubusercontent.com/kubernetes/kubernetes/release-1.37/api/openapi-spec/swagger.json"

          def fetch(url, retries=5):
              # Same Retry-After-aware backoff as every other repo's own
              # fetch() this session, kept here for consistency even
              # though a single-document fetch is lower 429 risk than the
              # multi-member loops that first surfaced this bug.
              req = urllib.request.Request(url, headers={"User-Agent": "ubx-hash-watch"})
              for i in range(retries):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return resp.read()
                  except urllib.error.HTTPError as e:
                      if i == retries - 1:
                          raise
                      retry_after = e.headers.get("Retry-After") if e.code == 429 else None
                      time.sleep(float(retry_after) if retry_after else 5 * (2 ** i))
                  except Exception:
                      if i == retries - 1:
                          raise
                      time.sleep(5 * (2 ** i))

          def json_default(o):
              if isinstance(o, (datetime.date, datetime.datetime)):
                  return o.isoformat()
              raise TypeError(f"not JSON serializable: {o!r}")

          def canonicalize(raw_bytes):
              text = raw_bytes.decode("utf-8")
              try:
                  doc = json.loads(text)
              except json.JSONDecodeError:
                  doc = yaml.safe_load(text)
              # Same revision-key strip as every other repo's own
              # canonicalize() this session -- a real no-op here (checked
              # directly: this document has no top-level "revision" key),
              # kept only so all six repos run identical logic.
              if isinstance(doc, dict) and "revision" in doc:
                  doc = {k: v for k, v in doc.items() if k != "revision"}
              return json.dumps(doc, sort_keys=True, separators=(",", ":"), default=json_default).encode("utf-8")

          try:
              h = hashlib.sha256()
              h.update(canonicalize(fetch(URL)))
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("ok=true\n")
                  out.write(f"hash={h.hexdigest()}\n")
              print(f"Live canonicalized spec-sha256: {h.hexdigest()}")
          except Exception as e:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("ok=false\n")
                  out.write(f"error={e!r}\n")
              print(f"FAILED to fetch/hash the real live spec: {e!r}")
          PYEOF

      - name: Compare against this repo's committed hash
        id: compare
        run: |
          set -euo pipefail
          current="$(grep '^spec-sha256:' VERSION | awk '{print $2}')"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "This repo was last generated from spec-sha256: $current"
          if [ "${{ steps.spec.outputs.ok }}" != "true" ]; then
            echo "state=error" >> "$GITHUB_OUTPUT"
            echo "detail=could not fetch/hash the real live spec: ${{ steps.spec.outputs.error }}" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "${{ steps.spec.outputs.hash }}" ]; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
            echo "detail=live spec-sha256 matches VERSION." >> "$GITHUB_OUTPUT"
            echo "Already current -- nothing to do."
          else
            echo "state=drift" >> "$GITHUB_OUTPUT"
            echo "detail=live spec-sha256 ${{ steps.spec.outputs.hash }} does not match VERSION's own $current." >> "$GITHUB_OUTPUT"
          fi

      - name: Find any existing error tracking issue
        id: existing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          error_number="$(gh issue list --label "$ERROR_ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          echo "error_number=$error_number" >> "$GITHUB_OUTPUT"

      - name: Surface an error state -- never allowed to look like "nothing to report"
        if: steps.compare.outputs.state == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="**hash-watch could not check this repo for drift.**

          ${{ steps.compare.outputs.detail }}

          Full workflow run: $run_url"
          if [ -n "${{ steps.existing.outputs.error_number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.error_number }}" --body "$body"
          else
            gh issue create --title "hash-watch: unable to check for drift" --label "$ERROR_ISSUE_LABEL" --body "$body"
          fi

      - name: Close a stale error tracking issue once checking works again
        if: steps.compare.outputs.state != 'error' && steps.existing.outputs.error_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue close "${{ steps.existing.outputs.error_number }}" \
            --comment "hash-watch checked successfully on this run (state: ${{ steps.compare.outputs.state }}) -- closing."

      - name: Fail this run's own status on error, so it never shows green by accident
        if: steps.compare.outputs.state == 'error'
        run: |
          echo "state: error -- ${{ steps.compare.outputs.detail }}"
          exit 1

      # --- everything below only runs when the schema content changed ---

      - name: Check out ubiquex (to build ubx from source)
        if: steps.compare.outputs.state == 'drift'
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules \
            "https://github.com/Ubiquex/ubiquex.git" \
            "${{ runner.temp }}/ubiquex-src"
          git clone --depth=1 \
            "https://github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        if: steps.compare.outputs.state == 'drift'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubiquex-src/go.mod

      - name: Set up Deno
        if: steps.compare.outputs.state == 'drift'
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.x"

      - name: Build ubx
        if: steps.compare.outputs.state == 'drift'
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubiquex-src" -o "${{ runner.temp }}/ubx" ./cmd/ubx
          "${{ runner.temp }}/ubx" version

      - name: Regenerate bindings (all three languages)
        if: steps.compare.outputs.state == 'drift'
        env:
          UBX_PROVIDER_DYNAMIC_REPO: ${{ runner.temp }}/ubx-provider-dynamic-src
        run: |
          set -euo pipefail
          gendir="${{ runner.temp }}/ubxgen"
          mkdir -p "$gendir/.ubx"
          cat > "$gendir/.ubx/config" <<EOF
          [dynamic_providers.kubernetes]
          schema_source = "openapi"
          schema_url = "https://raw.githubusercontent.com/kubernetes/kubernetes/release-1.37/api/openapi-spec/swagger.json"
          base_url = "https://kubernetes.example.invalid"
          EOF

          # Each language's own semver `version` field is owned by
          # publish.yml, not by codegen -- codegen always writes "0.0.0".
          # Capture the real, currently-committed values before regen
          # overwrites them, restore after.
          own_ts_version="$(python3 -c "import json; print(json.load(open('sdk/typescript/package.json'))['version'])")"
          own_py_version="$(python3 -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")"

          mkdir -p "$gendir/out/kubernetes/sdk/go"
          cp sdk/go/go.mod "$gendir/out/kubernetes/sdk/go/go.mod"

          # UBI-240 slice 5: artifacts/kubernetes/ now lives in this repo
          # (moved out of ubiquex-docs) -- an absolute path, since the
          # actual sdk gen invocation below runs from $gendir, not here.
          # loadCheckedInDescriptions reads <dir>/kubernetes.json
          # specifically, the {resource: {relPath: text}} shape a real
          # description-authoring session produces via
          # export_raw_descriptions.py --nested-out (ubiquex-docs, run
          # against a sibling checkout of this repo) and commits
          # alongside descriptions.json in the same PR -- not this
          # workflow's own job to generate at CI time, only to read.
          # Before this, this step never passed --descriptions-dir at
          # all, so every regen silently generated without the real,
          # checked-in description corpus (found live, UBI-102's own
          # pin was never wired into this workflow -- see that ticket's
          # own comment for the full account). This is the fix.
          descriptions_dir="$PWD/artifacts/kubernetes"

          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --only kubernetes --lang go --out out --descriptions-dir "$descriptions_dir" --require-clean-provenance )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --only kubernetes --lang ts --out out --descriptions-dir "$descriptions_dir" --require-clean-provenance )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --only kubernetes --lang py --out out --descriptions-dir "$descriptions_dir" --require-clean-provenance )

          # UBI-197: real ubx-provider-dynamic provenance (source, commit,
          # dirty, unpushed) -- --require-clean-provenance above already
          # refuses on anything but a clean, pushed commit, so this is
          # real confirmation, not just a record of an unverified claim.
          # Committed to this repo's own root, sibling to VERSION.
          cp "$gendir/out/kubernetes/PROVENANCE.json" PROVENANCE.json

          rsync -a --delete \
            --exclude='go.sum' \
            "$gendir/out/kubernetes/sdk/go/" sdk/go/
          rsync -a --delete \
            --exclude='deno.json' --exclude='deno.lock' \
            "$gendir/out/kubernetes/sdk/typescript/" sdk/typescript/
          rsync -a --delete \
            "$gendir/out/kubernetes/sdk/python/" sdk/python/

          python3 -c "
          import json
          p = 'sdk/typescript/package.json'
          d = json.load(open(p))
          d['version'] = '$own_ts_version'
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          python3 -c "
          import re
          p = 'sdk/python/pyproject.toml'
          content = open(p).read()
          content = re.sub(r'version = \"[^\"]+\"', 'version = \"$own_py_version\"', content, count=1)
          open(p, 'w').write(content)
          "

          cat > VERSION <<EOF
          spec-sha256: ${{ steps.spec.outputs.hash }}
          fetched: $(date -u +%Y-%m-%d)
          source: https://raw.githubusercontent.com/kubernetes/kubernetes/release-1.37/api/openapi-spec/swagger.json
          EOF

      - name: Refresh sdk/typescript/deno.json's exports map for the regenerated tree
        if: steps.compare.outputs.state == 'drift'
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os

          with open("sdk/typescript/deno.json") as fh:
              cfg = json.load(fh)

          exports = {}
          for dirpath, _, filenames in os.walk("sdk/typescript/kubernetes"):
              for f in sorted(filenames):
                  if not f.endswith(".ts"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), "sdk/typescript")
                  exports["./" + rel[:-3]] = "./" + rel

          cfg["exports"] = exports

          with open("sdk/typescript/deno.json", "w") as fh:
              json.dump(cfg, fh, indent=2)
              fh.write("\n")

          print(f"sdk/typescript/deno.json exports: {len(exports)} entries")
          PYEOF

      - name: Regenerate sdk/go/go.sum
        if: steps.compare.outputs.state == 'drift'
        run: |
          set -euo pipefail
          cd sdk/go
          go mod tidy

      - name: Sanity-check the regenerated Go tree still builds
        if: steps.compare.outputs.state == 'drift'
        run: |
          set -euo pipefail
          cd sdk/go
          go build ./...
          go vet ./...

      - name: Sanity-check the regenerated TS tree still typechecks
        if: steps.compare.outputs.state == 'drift'
        run: |
          set -euo pipefail
          cd sdk/typescript
          find . -name "*.ts" -print0 | xargs -0 deno cache
          find . -name "*.ts" -print0 | xargs -0 deno check --frozen

      - name: Sanity-check the regenerated Python tree -- real import of every module
        if: steps.compare.outputs.state == 'drift'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          deps="$(cd sdk/python && python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")"
          pip install $deps
          python3 - <<'PYEOF'
          import os, sys, importlib

          repo_root = os.path.join(os.getcwd(), "sdk", "python")
          sys.path.insert(0, repo_root)

          count = 0
          errors = []
          for dirpath, dirnames, filenames in os.walk(repo_root):
              for f in filenames:
                  if not f.endswith(".py"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), repo_root)
                  mod = rel[:-3].replace(os.sep, ".")
                  if mod.endswith(".__init__"):
                      mod = mod[: -len(".__init__")]
                  try:
                      importlib.import_module(mod)
                      count += 1
                  except Exception as e:
                      errors.append((mod, str(e)))

          print(f"imported {count} modules OK")
          if errors:
              print(f"{len(errors)} ERRORS:")
              for m, e in errors:
                  print(f"  {m}: {e}")
              sys.exit(1)
          print("ZERO errors")
          PYEOF

      - name: Open PR
        if: steps.compare.outputs.state == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          short="$(echo "${{ steps.spec.outputs.hash }}" | cut -c1-12)"
          branch="sdk-regen/kubernetes-$short"
          git checkout -b "$branch"
          git add -A
          git commit -m "sdk: regenerate from Kubernetes OpenAPI spec $short"
          git push origin "$branch" --force
          gh pr create \
            --title "sdk: regenerate from Kubernetes OpenAPI spec $short" \
            --body "Automated regeneration (\`.github/workflows/hash-watch.yml\`) triggered by a schema content change on Kubernetes' live release-1.37 branch OpenAPI/Swagger description -- all three languages (sdk/go/, sdk/typescript/, sdk/python/) regenerated together in this one PR.

          Previous spec-sha256: \`${{ steps.compare.outputs.current }}\`
          New spec-sha256: \`${{ steps.spec.outputs.hash }}\`

          New files = new resource type. Modified files = an existing resource's schema changed. This never auto-merges -- review the diff before merging." \
            --base main --head "$branch"
